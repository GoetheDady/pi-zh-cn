name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 上游金丝雀：pi 发布新版后 peerDependencies("*") 会拉到最新实现，
  # 契约测试失败即说明上游结构变化，需核对对应文案。
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
