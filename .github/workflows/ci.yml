name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 上游金丝雀：pi 发布新版后拉最新实现跑契约测试，失败即说明上游结构
  # 变化，需核对对应文案。注意 package-lock.json 钉着旧版 pi，定时任务
  # 必须忽略它，否则永远装不到上游新版（见下方 install 步骤）。
  schedule:
    - cron: "0 3 */2 * *" # 每两天 03:00 UTC（月末按日期取奇偶，间隔可能有 ±1 天浮动）

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 金丝雀（schedule）忽略 lockfile，peerDependencies("*") 才能解析到
      # 上游最新版；push/PR 仍按 lock 安装，保证可复现。
      - name: 安装依赖
        run: npm install ${{ github.event_name == 'schedule' && '--no-package-lock' || '' }}
      - run: npm test
